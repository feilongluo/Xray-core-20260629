name: Build and Release SF Custom Xray

on:
  push:
    tags:
      - "v*-sf.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v26.6.27-sf.2"
        required: true
        type: string
      prerelease:
        description: "Mark the release as prerelease"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sf-custom-xray-release-${{ github.ref_name }}-${{ github.event.inputs.tag || '' }}
  cancel-in-progress: false

jobs:
  focused-tests:
    name: Run focused custom Xray tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run focused tests
        run: |
          go test -count=1 ./proxy/wireguard ./app/proxyman/outbound
          go test -count=1 ./infra/conf -run 'WireGuardLifecycle|ParseWireGuardKey'

  build-linux:
    name: Build Linux ${{ matrix.goarch }} custom Xray
    runs-on: ubuntu-latest
    needs: focused-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            asset_name: Xray-linux-64.zip
            artifact_name: sf-custom-xray-linux-amd64
          - goarch: arm64
            asset_name: Xray-linux-arm64-v8a.zip
            artifact_name: sf-custom-xray-linux-arm64
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
      ASSET_NAME: ${{ matrix.asset_name }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE_TAG="${{ github.event.inputs.tag }}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-sf\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z-sf.N, got '${RELEASE_TAG}'." >&2
            exit 1
          fi

          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"

      - name: Build Xray
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_assets dist
          COMMIT_ID="$(git rev-parse --short=8 HEAD)-sf"
          go build \
            -o build_assets/xray \
            -trimpath \
            -buildvcs=false \
            -gcflags="all=-l=4" \
            -ldflags="-X github.com/xtls/xray-core/core.build=${COMMIT_ID} -s -w -buildid=" \
            -v ./main
          chmod 0755 build_assets/xray
          if [[ "${GOARCH}" == "amd64" ]]; then
            ./build_assets/xray version
          fi

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail
          cp README.md LICENSE build_assets/
          (
            cd build_assets
            touch -mt "$(date -u +%Y01010000)" *
            zip -9vr "../dist/${ASSET_NAME}" .
          )
          sha256sum "dist/${ASSET_NAME}" | tee "dist/${ASSET_NAME}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.asset_name }}.sha256
          if-no-files-found: error

  publish-release:
    name: Publish custom Xray release
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE_TAG="${{ github.event.inputs.tag }}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-sf\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z-sf.N, got '${RELEASE_TAG}'." >&2
            exit 1
          fi

          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: List release artifacts
        run: ls -l dist

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ github.event.inputs.prerelease || 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES="$(mktemp)"
          {
            echo "SF custom Xray build for proxy-ui."
            echo
            echo "- Base Xray version: v26.6.27"
            echo "- Build commit: ${GITHUB_SHA}"
            echo "- Assets: Xray-linux-64.zip, Xray-linux-arm64-v8a.zip"
            echo "- SHA256 files are uploaded next to each asset."
          } > "${NOTES}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/Xray-linux-64.zip dist/Xray-linux-64.zip.sha256 dist/Xray-linux-arm64-v8a.zip dist/Xray-linux-arm64-v8a.zip.sha256 --clobber
          else
            FLAGS=()
            if [[ "${PRERELEASE}" == "true" ]]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "${RELEASE_TAG}" \
              dist/Xray-linux-64.zip \
              dist/Xray-linux-64.zip.sha256 \
              dist/Xray-linux-arm64-v8a.zip \
              dist/Xray-linux-arm64-v8a.zip.sha256 \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TAG}" \
              --notes-file "${NOTES}" \
              "${FLAGS[@]}"
          fi
